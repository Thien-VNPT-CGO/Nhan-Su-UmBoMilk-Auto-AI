services:
  db:
    image: postgres:16-alpine
    container_name: umbomilk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umbomilk
      POSTGRES_USER: umbomilk
      POSTGRES_PASSWORD: umbomilk123
    ports:
      - "5432:5432"
    volumes:
      - umbomilk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbomilk -d umbomilk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  umbomilk_pgdata:
