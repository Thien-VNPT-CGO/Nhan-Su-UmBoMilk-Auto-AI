# Render Blueprint - UMBO MILK (deploy chuẩn 1 lần: web + API + PostgreSQL)
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này
services:
  - type: web
    name: umbomilk-server
    runtime: node
    repo: https://github.com/Thien-VNPT-CGO/Nhan-Su-UmBoMilk-Auto-AI
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umbomilk-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DEMO_MODE
        value: "true"

databases:
  - name: umbomilk-db
    plan: free
    databaseName: umbomilk
    user: umbomilk